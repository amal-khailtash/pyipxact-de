[project]
name = "pyipxact-de"
version = "0.7.0"
description = "Accellera IP-XACT DE (Design Environment)"
readme = "README.md"
license = { text = "MIT License" }
authors = [
    { name = "Amal Khailtash", email = "amal.khailtash@gmail.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Environment :: X11 Applications :: Qt",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    # "fastapi[standard]>=0.116.1",
    # "click>=8.1.8",
    "rich>=14.1.0",
    "loguru>=0.7.3",
    "xsdata[cli,lxml,soap]>=24.11",
    "xsdata-pydantic[cli,lxml,soap]>=24.5",
    # The validation server uses the MCP 1.x decorator API.
    "mcp[cli]>=1.28.0,<2",
    "xmlschema>=4.2.0",
    "objbrowser>=1.3.1",
    "pyslang>=12.0.0",
    "prompt-toolkit>=3.0.53",
    "pygments>=2.21.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=7.0.0",
    # "toml>=0.10.2",
    "sphinx>=8.2.3",
    "myst-parser>=3.0.1",
    "sphinx-contributors>=0.2.7",
    "sphinx-github-changelog>=1.7.1",
    "sphinx-rtd-theme>=3.0.2",
    "uvicorn>=0.35.0",
    "pytest-xdist>=3.8.0",
    "filelock>=3.20.0",
]

[project.optional-dependencies]
gui = [
    "pyqt5>=5.15.11",
    "qtawesome>=1.4.0",
    "qtpy>=2.4.3",
]
web = [
    "pydantic>=2.11.7",
    "fastapi>=0.116.1",
]
all = ["pyipxact-de[gui, web]"]

# [tool.setuptools.packages.find]

[project.scripts]
ipxact-de = "amal.eda.ipxact_de.cli.__main__:main"
sv-expr-repl = "amal.eda.systemverilog.repl:main"
# ipxact-de = "amal.eda.ipxact_de.cli.click_app:main"
# ipxact-wb = "amal.eda.ipxact_de.cli.click_app:main"
# ipxact-wb = "amal.eda.ipxact_de.web.__init__:app"

[tool.hatch.build.targets.sdist]
# include = []
exclude = [
    ".ruff_cache/",
    ".uv_cache/",
    "PyXB/",
    # Local IP repository symlink; not part of the distribution.
    "/ipxact",
    "test-*",
]

# [tool.uv.sources]
# xsdata = { git = "https://github.com/tefra/xsdata" }

[tool.hatch.build.targets.wheel]
packages = [
    # "src",
    "src/amal",
    "src/org"
]

# [tool.isort]
# profile = "black"
# line_length = 120
# src_paths = ["isort", "test"]
# known_third_party = [
#     "loguru",
#     "rich",
#     "xsdata",
# ]
# known_first_party = ["amal", "org.accellera"]
# import_heading_future = "Future Imports"
# import_heading_stdlib = "Standard Library Imports"
# import_heading_thirdparty = "Third-Party Imports"
# import_heading_firstparty = "First-Party Imports"
# import_heading_localfolder = "Local Imports"

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    # "src",
    "src"
]
addopts = [
    "-v",
    "--tb=short",
    # "--color=no",
    "--strict-markers",
    "--disable-warnings",
    "-p no:terminalprogress",
]
markers = [
    "golden_file: marks tests as golden file tests",
    "batch_mode: marks tests as batch mode tests",
]
# console_output_style = "classic"

# -------------------------------------------------------------------------------------------------
# PyreFly configuration: force the language server to use this workspace's venv and src import root
# See: https://pyrefly.org/en/docs/configuration/
[tool.pyrefly]
# Make imports resolve from our `src` layout
# search-path = ["src"]
project-includes = [
    "src"
]
# # Ensure PyreFly queries the correct interpreter and site-packages from this repo's venv
python-interpreter = ".venv/bin/python3"
site-package-path = [
    ".venv/lib/python3.14/site-packages"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [build-system]
# requires = ["uv_build>=0.8.6,<0.9.0"]
# build-backend = "uv_build"
