name: 02. CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Select validation / release metadata
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
      - name: Select validation
        id: classify
        env:
          IS_RELEASE: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--') }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$IS_RELEASE" = true ]; then
            git show "$BASE_REF:tools/check_release_metadata.py" > "$RUNNER_TEMP/check_release_metadata.py"
            uv run --no-project python "$RUNNER_TEMP/check_release_metadata.py" --base "$BASE_REF" --head "$HEAD_REF"
            uv lock --check
            echo 'mode=release' >> "$GITHUB_OUTPUT"
            echo 'Release metadata validated; full source CI already runs on feature PRs.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            echo 'Running full feature validation.' >> "$GITHUB_STEP_SUMMARY"
          fi
  tests:
    name: Tests and coverage
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Read project metadata from depot
        id: project
        run: |
          uv run --no-project python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          name = project["name"]
          description = project.get("description", "")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"name={name}", file=output)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print(f"### {name}\n\n{description}", file=summary)
          PYTHON
      - name: Set up ${{ steps.project.outputs.name }} dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils xsltproc
          uv sync --locked --all-groups
      - name: Run semantic tests and coverage
        env:
          COVERAGE_SOURCE: src
        run: uv run --locked pytest -n 4 --dist=worksteal --durations=15 --cov="$COVERAGE_SOURCE" --cov-report=term-missing --cov-report=xml:build/coverage/coverage.xml --cov-report=html:build/coverage/html
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('build/coverage/coverage.xml') != '' }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: false
  build:
    name: Build distributions
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    uses: ./.github/workflows/distributions.yml
    with:
      ref: ${{ github.ref }}
  documentation:
    name: Build documentation
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Check documentation
        run: |
          uv sync --locked --all-groups
          uv run --locked make -C docs api html
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: build/docs/
