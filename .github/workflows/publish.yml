name: 04. Publish
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      repository:
        description: Publication destination
        type: choice
        options: [pypi, testpypi]
        default: pypi
        required: true
      tag:
        description: Existing release tag to publish (for example v0.3.0)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
    secrets: inherit
  verify:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Verify immutable tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git -c safe.directory="$PWD" show-ref --verify "refs/tags/$RELEASE_TAG"
          git -c safe.directory="$PWD" merge-base --is-ancestor HEAD origin/main
          uv run --no-project python -c 'import os,tomllib; from pathlib import Path; v=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+v'
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.repository || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ci-distributions
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish with uv trusted publishing
        if: inputs.repository != 'testpypi'
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: Publish to TestPyPI with uv trusted publishing
        if: inputs.repository == 'testpypi'
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/
  documentation:
    needs: publish
    if: inputs.repository != 'testpypi'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger released documentation after PyPI publication
        env:
          RTD_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
          RTD_PROJECT: pyipxact-de
          RTD_VERSION: ${{ inputs.tag }}
        run: |
          test -n "$RTD_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Token $RTD_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://readthedocs.org/api/v3/projects/$RTD_PROJECT/versions/$RTD_VERSION/builds/"
