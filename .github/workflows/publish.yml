name: Publish release to PyPI
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example v0.3.0)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          submodules: recursive
      - uses: astral-sh/setup-uv@v5
      - name: Verify immutable tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          uv run --no-project python -c 'import os,tomllib; from pathlib import Path; v=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+v'
          git merge-base --is-ancestor HEAD origin/main
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils xsltproc
      - run: uv sync --locked --all-groups
      - run: uv run --locked pytest -q
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - name: Generate PEP 740 attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish with uv trusted publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
